services:
  db:
    image: mysql:8.0
    container_name: gestao-epi-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestao_epi
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: gestao-epi-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/gestao_epi?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      DB_USER: root
      DB_PASSWORD: root
    ports:
      - "8080:8080"

volumes:
  db-data:
