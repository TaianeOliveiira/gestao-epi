spring.application.name=gestao-epi
server.port=8080

# MySQL (padrão). Pode ser sobrescrito por variáveis de ambiente (usado no Docker).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestao_epi?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
