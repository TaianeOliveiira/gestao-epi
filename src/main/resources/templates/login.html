<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Gestão de EPIs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="card shadow-sm" style="width: 100%; max-width: 380px;">
        <div class="card-body p-4">
            <h1 class="h4 text-center mb-1">Gestão de EPIs</h1>
            <p class="text-center text-muted mb-4">Entre com o seu login e senha</p>

            <div th:if="${param.erro != null}" class="alert alert-danger" role="alert">
                Login ou senha inválidos.
            </div>
            <div th:if="${param.saiu != null}" class="alert alert-success" role="alert">
                Você saiu do sistema.
            </div>

            <form method="post" th:action="@{/login}">
                <div class="mb-3">
                    <label for="username" class="form-label">Login</label>
                    <input type="text" id="username" name="username" class="form-control" autofocus required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
