<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: layout(~{::title}, ~{::main}, 'emprestimos')}">
<head>
    <title>Controle de EPI</title>
</head>
<body>
<main>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Controle de EPI</h1>
        <a class="btn btn-primary" th:href="@{/emprestimos/novo}">Novo empréstimo</a>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm text-center"><div class="card-body">
                <div class="display-6" th:text="${qtdEmprestado}">0</div>
                <div class="text-muted">Emprestado</div>
            </div></div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm text-center"><div class="card-body">
                <div class="display-6" th:text="${qtdFornecido}">0</div>
                <div class="text-muted">Fornecido</div>
            </div></div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm text-center"><div class="card-body">
                <div class="display-6" th:text="${qtdDevolvido}">0</div>
                <div class="text-muted">Devolvido</div>
            </div></div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Colaborador</th>
                    <th>Equipamento</th>
                    <th>Qtd.</th>
                    <th>Empréstimo</th>
                    <th>Prevista</th>
                    <th>Devolução</th>
                    <th>Status</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${emprestimos}">
                    <td th:text="${e.colaborador.nome}"></td>
                    <td th:text="${e.epi.nome}"></td>
                    <td th:text="${e.quantidade}"></td>
                    <td th:text="${#temporals.format(e.dataEmprestimo, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${e.dataPrevistaDevolucao != null} ? ${#temporals.format(e.dataPrevistaDevolucao, 'dd/MM/yyyy HH:mm')} : '-'"></td>
                    <td th:text="${e.dataDevolucao != null} ? ${#temporals.format(e.dataDevolucao, 'dd/MM/yyyy HH:mm')} : '-'"></td>
                    <td><span class="badge" th:classappend="${e.status.cor}" th:text="${e.status.rotulo}"></span></td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/emprestimos/{id}/editar(id=${e.id})}">Atualizar status</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(emprestimos)}">
                    <td colspan="8" class="text-center text-muted py-4">Desculpe, mas não encontramos dados correspondentes à sua busca.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
