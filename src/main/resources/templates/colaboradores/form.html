<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${edicao} ? 'Editar colaborador' : 'Cadastrar colaborador'">Colaborador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand">Gestão de EPIs</span>
        <div>
            <a class="btn btn-outline-light btn-sm" th:href="@{/colaboradores}">Colaboradores</a>
            <a class="btn btn-warning btn-sm" th:href="@{/colaboradores/novo}">Novo colaborador</a>
        </div>
    </div>
</nav>

<main class="container" style="max-width: 760px;">
    <h1 class="h3 mb-3" th:text="${edicao} ? 'Editar colaborador' : 'Cadastrar colaborador'">Colaborador</h1>

    <!-- Feedback de sucesso / falha (Bootstrap) -->
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>

    <form class="card card-body shadow-sm" method="post" novalidate
          th:action="${edicao} ? @{/colaboradores/{id}(id=${colaborador.id})} : @{/colaboradores}"
          th:object="${colaborador}">

        <div class="row g-3">
            <div class="col-md-8">
                <label for="nome" class="form-label">Nome *</label>
                <input type="text" id="nome" class="form-control" th:field="*{nome}"
                       th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{nome}"></div>
            </div>

            <div class="col-md-4">
                <label for="matricula" class="form-label">Matrícula *</label>
                <input type="text" id="matricula" class="form-control" th:field="*{matricula}"
                       th:classappend="${#fields.hasErrors('matricula')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{matricula}"></div>
            </div>

            <div class="col-md-4">
                <label for="cpf" class="form-label">CPF *</label>
                <input type="text" id="cpf" class="form-control" placeholder="000.000.000-00" th:field="*{cpf}"
                       th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{cpf}"></div>
            </div>

            <div class="col-md-4">
                <label for="cargo" class="form-label">Cargo *</label>
                <input type="text" id="cargo" class="form-control" th:field="*{cargo}"
                       th:classappend="${#fields.hasErrors('cargo')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{cargo}"></div>
            </div>

            <div class="col-md-4">
                <label for="setor" class="form-label">Setor *</label>
                <input type="text" id="setor" class="form-control" th:field="*{setor}"
                       th:classappend="${#fields.hasErrors('setor')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{setor}"></div>
            </div>

            <div class="col-md-8">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" id="email" class="form-control" th:field="*{email}"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>

            <div class="col-md-4">
                <label for="dataAdmissao" class="form-label">Data de admissão</label>
                <input type="date" id="dataAdmissao" class="form-control" th:field="*{dataAdmissao}">
            </div>

            <div class="col-12">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="ativo" th:field="*{ativo}">
                    <label class="form-check-label" for="ativo">Colaborador ativo</label>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary"
                    th:text="${edicao} ? 'Salvar alterações' : 'Cadastrar'">Salvar</button>
            <a class="btn btn-outline-secondary" th:href="@{/colaboradores}">Voltar à lista</a>
        </div>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
