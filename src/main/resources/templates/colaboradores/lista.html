<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Colaboradores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand">Gestão de EPIs</span>
        <div>
            <a class="btn btn-outline-light btn-sm" th:href="@{/colaboradores}">Colaboradores</a>
            <a class="btn btn-warning btn-sm" th:href="@{/colaboradores/novo}">Novo colaborador</a>
        </div>
    </div>
</nav>

<main class="container">
    <h1 class="h3 mb-3">Colaboradores</h1>

    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>

    <!-- Pesquisa por nome -->
    <form class="row g-2 mb-3" method="get" th:action="@{/colaboradores}">
        <div class="col-sm-8 col-md-6">
            <input type="search" name="nome" class="form-control" placeholder="Pesquisar por nome"
                   th:value="${nome}">
        </div>
        <div class="col-auto">
            <button class="btn btn-primary" type="submit">Pesquisar</button>
            <a class="btn btn-outline-secondary" th:href="@{/colaboradores}" th:if="${!#strings.isEmpty(nome)}">Limpar</a>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Nome</th>
                    <th>Matrícula</th>
                    <th>CPF</th>
                    <th>Cargo</th>
                    <th>Setor</th>
                    <th>Situação</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${colaboradores}">
                    <td th:text="${c.nome}"></td>
                    <td th:text="${c.matricula}"></td>
                    <td th:text="${c.cpf}"></td>
                    <td th:text="${c.cargo}"></td>
                    <td th:text="${c.setor}"></td>
                    <td>
                        <span class="badge" th:classappend="${c.ativo} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${c.ativo} ? 'Ativo' : 'Inativo'"></span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/colaboradores/{id}/editar(id=${c.id})}">Editar</a>
                        <button type="button" class="btn btn-sm btn-outline-danger"
                                data-bs-toggle="modal" data-bs-target="#modalExcluir"
                                th:attr="data-id=${c.id}, data-nome=${c.nome}">Excluir</button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(colaboradores)}">
                    <td colspan="7" class="text-center text-muted py-4">Nenhum colaborador encontrado.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Modal de confirmação de exclusão -->
<div class="modal fade" id="modalExcluir" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="tituloModal">Confirmar exclusão</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                Deseja realmente excluir o colaborador <strong id="nomeExcluir"></strong>?
                Esta ação não pode ser desfeita.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <form id="formExcluir" method="post">
                    <button type="submit" class="btn btn-danger">Excluir</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    const baseUrl = /*[[@{/colaboradores}]]*/ '/colaboradores';
    document.getElementById('modalExcluir').addEventListener('show.bs.modal', function (event) {
        const botao = event.relatedTarget;
        document.getElementById('nomeExcluir').textContent = botao.getAttribute('data-nome');
        document.getElementById('formExcluir').action = baseUrl + '/' + botao.getAttribute('data-id') + '/excluir';
    });
</script>
</body>
</html>
