<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: layout(~{::title}, ~{::main}, 'emprestimos')}">
<head>
    <title th:text="${edicao} ? 'Atualizar empréstimo' : 'Cadastrar empréstimo'">Empréstimo</title>
</head>
<body>
<main style="max-width: 760px;">
    <h1 class="h3 mb-3" th:text="${edicao} ? 'Atualizar empréstimo' : 'Cadastrar empréstimo'">Empréstimo</h1>

    <form class="card card-body shadow-sm" method="post" novalidate
          th:action="${edicao} ? @{/emprestimos/{id}(id=${emprestimo.id})} : @{/emprestimos}"
          th:object="${form}">

        <div class="row g-3">

            <th:block th:if="${!edicao}">
                <div class="col-md-6">
                    <label for="colaboradorId" class="form-label">Colaborador *</label>
                    <select id="colaboradorId" class="form-select" th:field="*{colaboradorId}"
                            th:classappend="${#fields.hasErrors('colaboradorId')} ? 'is-invalid'">
                        <option value="">Selecione</option>
                        <option th:each="c : ${colaboradores}" th:value="${c.id}" th:text="${c.nome}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{colaboradorId}"></div>
                </div>

                <div class="col-md-6">
                    <label for="epiId" class="form-label">Equipamento *</label>
                    <select id="epiId" class="form-select" th:field="*{epiId}"
                            th:classappend="${#fields.hasErrors('epiId')} ? 'is-invalid'">
                        <option value="">Selecione</option>
                        <option th:each="e : ${equipamentos}" th:value="${e.id}"
                                th:text="${e.nome + ' (estoque: ' + e.quantidadeEstoque + ')'}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{epiId}"></div>
                </div>

                <div class="col-md-4">
                    <label for="quantidade" class="form-label">Quantidade *</label>
                    <input type="number" min="1" id="quantidade" class="form-control" th:field="*{quantidade}"
                           th:classappend="${#fields.hasErrors('quantidade')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{quantidade}"></div>
                </div>

                <div class="col-md-4">
                    <label for="dataEmprestimo" class="form-label">Data do empréstimo *</label>
                    <input type="datetime-local" id="dataEmprestimo" class="form-control" th:field="*{dataEmprestimo}"
                           th:classappend="${#fields.hasErrors('dataEmprestimo')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{dataEmprestimo}"></div>
                </div>

                <div class="col-md-4">
                    <label for="dataPrevistaDevolucao" class="form-label">Data prevista da devolução</label>
                    <input type="datetime-local" id="dataPrevistaDevolucao" class="form-control"
                           th:field="*{dataPrevistaDevolucao}"
                           th:classappend="${#fields.hasErrors('dataPrevistaDevolucao')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{dataPrevistaDevolucao}"></div>
                    <div class="form-text">Obrigatória para Emprestado.</div>
                </div>
            </th:block>

            <th:block th:if="${edicao}">
                <div class="col-md-6">
                    <label class="form-label">Colaborador</label>
                    <input type="text" class="form-control" th:value="${emprestimo.colaborador.nome}" disabled>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Equipamento</label>
                    <input type="text" class="form-control" th:value="${emprestimo.epi.nome}" disabled>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Quantidade</label>
                    <input type="text" class="form-control" th:value="${emprestimo.quantidade}" disabled>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Data do empréstimo</label>
                    <input type="text" class="form-control"
                           th:value="${#temporals.format(emprestimo.dataEmprestimo, 'dd/MM/yyyy HH:mm')}" disabled>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Data prevista da devolução</label>
                    <input type="text" class="form-control"
                           th:value="${emprestimo.dataPrevistaDevolucao != null} ? ${#temporals.format(emprestimo.dataPrevistaDevolucao, 'dd/MM/yyyy HH:mm')} : '-'"
                           disabled>
                </div>
            </th:block>

            <div class="col-md-4">
                <label for="status" class="form-label">Status *</label>
                <select id="status" class="form-select" th:field="*{status}"
                        th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'">
                    <option th:each="s : ${statusOpcoes}" th:value="${s}" th:text="${s.rotulo}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{status}"></div>
            </div>

            <div class="col-md-8">
                <label for="observacao" class="form-label">Condição do equipamento no empréstimo</label>
                <input type="text" id="observacao" class="form-control" th:field="*{observacao}"
                       th:classappend="${#fields.hasErrors('observacao')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{observacao}"></div>
            </div>

            <th:block th:if="${edicao}">
                <div id="camposDevolucao" class="col-12 d-none">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="dataDevolucao" class="form-label">Data da devolução *</label>
                            <input type="datetime-local" id="dataDevolucao" class="form-control"
                                   th:field="*{dataDevolucao}"
                                   th:classappend="${#fields.hasErrors('dataDevolucao')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{dataDevolucao}"></div>
                        </div>
                        <div class="col-md-8">
                            <label for="observacaoDevolucao" class="form-label">Observação na devolução</label>
                            <input type="text" id="observacaoDevolucao" class="form-control"
                                   th:field="*{observacaoDevolucao}"
                                   th:classappend="${#fields.hasErrors('observacaoDevolucao')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{observacaoDevolucao}"></div>
                        </div>
                    </div>
                </div>
            </th:block>
        </div>

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary"
                    th:text="${edicao} ? 'Salvar alterações' : 'Cadastrar'">Salvar</button>
            <a class="btn btn-outline-secondary" th:href="@{/emprestimos}">Voltar à lista</a>
        </div>
    </form>

    <script>
        (function () {
            const status = document.getElementById('status');
            const bloco = document.getElementById('camposDevolucao');
            if (!status || !bloco) { return; }
            const comDevolucao = ['DEVOLVIDO', 'DANIFICADO', 'PERDIDO'];

            function agoraLocal() {
                const d = new Date();
                d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
                return d.toISOString().slice(0, 16);
            }

            function atualizar() {
                const mostrar = comDevolucao.includes(status.value);
                bloco.classList.toggle('d-none', !mostrar);
                const data = document.getElementById('dataDevolucao');
                if (mostrar && data && !data.value) { data.value = agoraLocal(); }
            }

            status.addEventListener('change', atualizar);
            atualizar();
        })();
    </script>
</main>
</body>
</html>
