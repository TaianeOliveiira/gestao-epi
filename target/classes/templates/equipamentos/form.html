<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: layout(~{::title}, ~{::main}, 'equipamentos')}">
<head>
    <title th:text="${edicao} ? 'Editar equipamento' : 'Cadastrar equipamento'">Equipamento</title>
</head>
<body>
<main style="max-width: 760px;">
    <h1 class="h3 mb-3" th:text="${edicao} ? 'Editar equipamento' : 'Cadastrar equipamento'">Equipamento</h1>

    <form class="card card-body shadow-sm" method="post" novalidate
          th:action="${edicao} ? @{/equipamentos/{id}(id=${epi.id})} : @{/equipamentos}"
          th:object="${epi}">

        <div class="row g-3">
            <div class="col-md-8">
                <label for="nome" class="form-label">Nome *</label>
                <input type="text" id="nome" class="form-control" th:field="*{nome}"
                       th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{nome}"></div>
            </div>

            <div class="col-md-4">
                <label for="categoria" class="form-label">Categoria *</label>
                <input type="text" id="categoria" class="form-control" th:field="*{categoria}"
                       th:classappend="${#fields.hasErrors('categoria')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{categoria}"></div>
            </div>

            <div class="col-md-4">
                <label for="ca" class="form-label">CA *</label>
                <input type="text" id="ca" class="form-control" th:field="*{ca}"
                       th:classappend="${#fields.hasErrors('ca')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{ca}"></div>
            </div>

            <div class="col-md-4">
                <label for="validadeCa" class="form-label">Validade do CA *</label>
                <input type="date" id="validadeCa" class="form-control" th:field="*{validadeCa}"
                       th:classappend="${#fields.hasErrors('validadeCa')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{validadeCa}"></div>
            </div>

            <div class="col-md-4">
                <label for="quantidadeEstoque" class="form-label">Quantidade em estoque *</label>
                <input type="number" min="0" id="quantidadeEstoque" class="form-control" th:field="*{quantidadeEstoque}"
                       th:classappend="${#fields.hasErrors('quantidadeEstoque')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{quantidadeEstoque}"></div>
            </div>

            <div class="col-12">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="ativo" th:field="*{ativo}">
                    <label class="form-check-label" for="ativo">Equipamento ativo</label>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary"
                    th:text="${edicao} ? 'Salvar alterações' : 'Cadastrar'">Salvar</button>
            <a class="btn btn-outline-secondary" th:href="@{/equipamentos}">Voltar à lista</a>
        </div>
    </form>
</main>
</body>
</html>
